<body>

  <script src="https://www.gstatic.com/firebasejs/11.3.1/firebase-auth-compat.js"></script>

  <script type="text/babel" data-presets="react">
    // CONFIGURACIÓN REAL DE FIREBASE - AKASHA YOGA
    const firebaseConfig = window.__firebaseConfig || {
      apiKey: "AIzaSyBCXBdp2W6_jggJaOAxwrMXbCuqpaLJwTg",
      authDomain: "akasha-yoga.firebaseapp.com",
      projectId: "akasha-yoga",
      storageBucket: "akasha-yoga.firebasestorage.app",
      messagingSenderId: "358022717826",
      appId: "1:358022717826:web:eca866be83077c3cc5af9b"
    };

    // Inicialización
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const auth = firebase.auth();

    const { useState, useEffect, useCallback, useRef, useMemo } = React;

    /* =============================================================
       ICON COMPONENTS (wrapping Lucide SVGs via React)
       ============================================================= */
    function LucideIcon({ name, className = "w-5 h-5" }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current) {
          ref.current.innerHTML = '';
          const el = lucide.createElement(lucide.icons[name]);
          if (el) {
            el.classList.add(...className.split(' ').filter(Boolean));
            ref.current.appendChild(el);
          }
        }
      }, [name, className]);
      return <span ref={ref} className="inline-flex items-center justify-center" />;
    }

    /* =============================================================
       1. SEED DATA — Simulated Database
       ============================================================= */
    const ADMIN_PHONE = '699999999';

    const CLASS_TYPES = [
      { id: 'hatha_flow', name: 'Hatha Flow', icon: 'Leaf', color: 'sage', duration: 75, maxCapacity: 12, description: 'Clase fluida que combina respiración y movimiento.' },
      { id: 'mov_funcional', name: 'Mov. Funcional', icon: 'Activity', color: 'sage', duration: 60, maxCapacity: 10, description: 'Movimiento funcional adaptado para adultos mayores.' },
      { id: 'vinyasa_alta', name: 'Vinyasa (I. Alta)', icon: 'Wind', color: 'sage', duration: 75, maxCapacity: 12, description: 'Secuencias dinámicas y exigentes de Vinyasa.' },
      { id: 'vinyasa_media', name: 'Vinyasa (I. Media)', icon: 'Cloud', color: 'sage', duration: 75, maxCapacity: 12, description: 'Vinyasa a ritmo moderado y equilibrado.' },
      { id: 'hatha_suave', name: 'Hatha Suave', icon: 'Thermometer', color: 'sage', duration: 60, maxCapacity: 12, description: 'Clase pausada ideal para la movilidad.' },
      { id: 'yoga_restaurativo', name: 'Yoga Restaurativo', icon: 'Moon', color: 'sage', duration: 90, maxCapacity: 10, description: 'Relajación profunda con soportes y calma.' },
      { id: 'sabado_especial', name: '*Clase completa*', icon: 'Sparkles', color: 'terracotta', duration: 150, maxCapacity: 15, description: 'Filosofía, pranayama, asanas y meditación.' },
    ];

    const SCHEDULE = [
      // Lunes
      { classId: 'hatha_flow', dayOfWeek: 1, time: '10:15' },
      { classId: 'mov_funcional', dayOfWeek: 1, time: '11:40' },
      { classId: 'hatha_flow', dayOfWeek: 1, time: '18:15' },
      { classId: 'hatha_flow', dayOfWeek: 1, time: '20:00' },
      // Martes
      { classId: 'vinyasa_alta', dayOfWeek: 2, time: '19:00' },
      { classId: 'vinyasa_media', dayOfWeek: 2, time: '20:30' },
      // Miércoles
      { classId: 'hatha_flow', dayOfWeek: 3, time: '10:15' },
      { classId: 'mov_funcional', dayOfWeek: 3, time: '11:40' },
      { classId: 'hatha_flow', dayOfWeek: 3, time: '18:15' },
      // Jueves
      { classId: 'vinyasa_alta', dayOfWeek: 4, time: '19:00' },
      { classId: 'vinyasa_media', dayOfWeek: 4, time: '20:30' },
      // Viernes
      { classId: 'hatha_suave', dayOfWeek: 5, time: '10:15' },
      { classId: 'yoga_restaurativo', dayOfWeek: 5, time: '18:00' },
      { classId: 'vinyasa_media', dayOfWeek: 5, time: '19:15' },
      // Sábado (especial 1er y 3er)
      { classId: 'sabado_especial', dayOfWeek: 6, time: '10:00' },
    ];

    /* ----- helpers ----- */
    function sanitizePhone(raw) { return raw.toString().replace(/[^0-9]/g, '').slice(0, 15); }
    function isValidPhone(p) { return p && p.length >= 9 && p.length <= 15; }

    /* Format date to YYYY-MM-DD using LOCAL timezone (never UTC!) */
    function localDateStr(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function formatDate(d) {
      return d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
    }
    function isSameDay(a, b) {
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }
    function getDayName(d) {
      return d.toLocaleDateString('es-ES', { weekday: 'long' });
    }

    /* Helper: day-of-week from date string (1=Mon..7=Sun) */
    function dowFromDateStr(dateStr) {
      const d = new Date(dateStr + 'T12:00');
      return d.getDay() === 0 ? 7 : d.getDay();
    }

    /* --- BONO ENGINE: apply bonos to groups --- */
    function applyBonosToGroups(users, groups) {
      const updatedGroups = { ...groups };
      const bonoUsers = Object.values(users).filter(u => u.bonos && u.bonos.length > 0 && !u.isBlocked);

      bonoUsers.forEach(user => {
        user.bonos.forEach(bono => {
          Object.keys(updatedGroups).forEach(gId => {
            const g = updatedGroups[gId];
            const gDow = dowFromDateStr(g.date);

            if (g.classId === bono.classId && gDow === bono.dayOfWeek && g.time === bono.time) {
              // 1. Ya está en la clase?
              if (g.slots.some(s => s.userId === user.phone)) return;

              // 2. Comprobamos MEMORIA de cancelaciones (muy importante)
              const memory = g.releasedBonos || [];
              if (memory.includes(user.phone)) {
                // Si el alumno canceló explícitamente, NO lo volvemos a meter
                return;
              }

              const freeIdx = g.slots.findIndex(s => s.status === 'released');
              if (freeIdx === -1) return; // clase llena

              const newSlots = [...g.slots];
              newSlots[freeIdx] = {
                ...newSlots[freeIdx],
                userId: user.phone,
                userName: user.name,
                status: 'bono',
                originalUserId: user.phone
              };
              updatedGroups[gId] = { ...g, slots: newSlots, releasedBonos: memory };
            }
          });
        });
      });
      return updatedGroups;
    }

    const DAYS_AHEAD = 60; // 2 months of classes

    /* ----- seed generation ----- */
    function generateSeedData(existingUsers) {
      const users = existingUsers ? { ...existingUsers } : {};
      if (!users[ADMIN_PHONE]) {
        users[ADMIN_PHONE] = { phone: ADMIN_PHONE, name: 'Administración', role: 'admin', registeredAt: Date.now() };
      }

      const groups = {};
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      for (let dayOffset = 0; dayOffset < DAYS_AHEAD; dayOffset++) {
        const date = new Date(today);
        date.setDate(today.getDate() + dayOffset);
        const dow = date.getDay() === 0 ? 7 : date.getDay();

        SCHEDULE.filter(s => s.dayOfWeek === dow).forEach(sched => {
          if (sched.classId === 'sabado_especial') {
            const dayOfMonth = date.getDate();
            const weekNumber = Math.ceil(dayOfMonth / 7);
            if (weekNumber !== 1 && weekNumber !== 3) return;
          }

          const classType = CLASS_TYPES.find(c => c.id === sched.classId);
          const groupId = `${sched.classId}_${localDateStr(date)}_${sched.time}`;

          const slots = [];
          for (let i = 0; i < classType.maxCapacity; i++) {
            slots.push({ slotIndex: i, userId: null, userName: null, status: 'released', originalUserId: null });
          }

          groups[groupId] = { id: groupId, classId: sched.classId, date: localDateStr(date), time: sched.time, slots, releasedBonos: [] };
        });
      }

      // Apply bonos after creating empty groups
      const finalGroups = applyBonosToGroups(users, groups);
      return { users, groups: finalGroups };
    }

    /* ----- auto-generate future groups (preserves existing) ----- */
    function ensureFutureGroups(existingData) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      let changed = false;
      const groups = { ...existingData.groups };

      // CLEANUP: remove groups with wrong day-of-week (from timezone bug)
      Object.keys(groups).forEach(gId => {
        const g = groups[gId];
        // Only clean schedule-generated groups (not custom events)
        const schedEntry = SCHEDULE.find(s => s.classId === g.classId && s.time === g.time);
        if (schedEntry) {
          const gDow = dowFromDateStr(g.date);
          if (gDow !== schedEntry.dayOfWeek) {
            // This group was created on the wrong day — remove it
            delete groups[gId];
            changed = true;
          }
        }
      });

      // Generate missing future groups
      for (let dayOffset = 0; dayOffset < DAYS_AHEAD; dayOffset++) {
        const date = new Date(today);
        date.setDate(today.getDate() + dayOffset);
        const dow = date.getDay() === 0 ? 7 : date.getDay();

        SCHEDULE.filter(s => s.dayOfWeek === dow).forEach(sched => {
          if (sched.classId === 'sabado_especial') {
            const dayOfMonth = date.getDate();
            const weekNumber = Math.ceil(dayOfMonth / 7);
            if (weekNumber !== 1 && weekNumber !== 3) return;
          }

          const groupId = `${sched.classId}_${localDateStr(date)}_${sched.time}`;
          if (!groups[groupId]) {
            const classType = CLASS_TYPES.find(c => c.id === sched.classId);
            const slots = [];
            for (let i = 0; i < classType.maxCapacity; i++) {
              slots.push({ slotIndex: i, userId: null, userName: null, status: 'released', originalUserId: null });
            }
            groups[groupId] = { id: groupId, classId: sched.classId, date: localDateStr(date), time: sched.time, slots, releasedBonos: [] };
            changed = true;
          }
        });
      }

      if (!changed) return existingData;

      // Apply bonos to all groups (new and existing)
      const finalGroups = applyBonosToGroups(existingData.users, groups);
      return { ...existingData, groups: finalGroups };
    }

    /* =============================================================
       2. TOAST — Visual Feedback
       ============================================================= */
    function Toast({ toasts, onDismiss }) {
      return (
        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[200] flex flex-col gap-2 w-[90vw] max-w-sm pointer-events-none">
          {toasts.map(t => (
            <div key={t.id} onClick={() => onDismiss(t.id)}
              className={`pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl shadow-lg backdrop-blur-xl border transition-all duration-500 animate-slide-in
                ${t.type === 'success' ? 'bg-sage-50/90 border-sage-200 text-sage-800' : ''}
                ${t.type === 'error' ? 'bg-red-50/90 border-red-200 text-red-800' : ''}
                ${t.type === 'info' ? 'bg-cream-100/90 border-cream-200 text-sage-800' : ''}
              `}>
              <LucideIcon name={t.type === 'success' ? 'Check' : t.type === 'error' ? 'AlertTriangle' : 'Sparkles'}
                className={`w-5 h-5 shrink-0 ${t.type === 'error' ? 'text-red-500' : 'text-sage-500'}`} />
              <p className="text-sm font-medium flex-1">{t.message}</p>
              <LucideIcon name="X" className="w-4 h-4 opacity-40 shrink-0 cursor-pointer" />
            </div>
          ))}
        </div>
      );
    }

    /* =============================================================
       3. LOGIN SCREEN
       ============================================================= */
    function LoginScreen({ onLogin }) {
      const [phone, setPhone] = useState('');
      const [error, setError] = useState('');
      const inputRef = useRef(null);

      useEffect(() => { inputRef.current?.focus(); }, []);

      const handleSubmit = (e) => {
        e.preventDefault();
        const clean = sanitizePhone(phone);
        if (!isValidPhone(clean)) { setError('Introduce un número válido (mínimo 9 dígitos)'); return; }
        onLogin(clean);
      };

      return (
        <div className="min-h-dvh flex flex-col items-center justify-center px-6 bg-gradient-to-br from-cream-50 via-sage-50 to-cream-100">
          <div className="absolute top-20 right-10 w-40 h-40 bg-sage-200/30 rounded-full blur-3xl" />
          <div className="absolute bottom-32 left-6 w-56 h-56 bg-cream-200/40 rounded-full blur-3xl" />

          <div className="relative z-10 w-full max-w-sm">
            <div className="text-center mb-10">
              <div className="inline-flex items-center justify-center w-20 h-20 rounded-full bg-sage-100 mb-4 shadow-sm">
                <LucideIcon name="Leaf" className="w-10 h-10 text-sage-600" />
              </div>
              <h1 className="text-4xl font-serif font-semibold text-sage-800 tracking-tight">Akasha</h1>
              <p className="text-sage-500 mt-1 text-sm font-light">Tu espacio de yoga</p>
            </div>

            <form onSubmit={handleSubmit}
              className="bg-white/70 backdrop-blur-xl rounded-3xl p-6 shadow-[0_8px_40px_rgba(74,103,65,0.08)] border border-sage-100/50">
              <label htmlFor="phone-input" className="block text-sm font-medium text-sage-700 mb-2">Número de móvil</label>
              <div className="relative">
                <span className="absolute left-3.5 top-1/2 -translate-y-1/2"><LucideIcon name="Phone" className="w-5 h-5 text-sage-400" /></span>
                <input ref={inputRef} id="phone-input" type="tel" inputMode="numeric" autoComplete="tel"
                  placeholder="Ej: 612 345 678" value={phone}
                  onChange={e => { setPhone(sanitizePhone(e.target.value)); setError(''); }}
                  className="w-full pl-12 pr-4 py-3.5 rounded-2xl bg-white/80 border border-sage-200 focus:border-sage-400 focus:ring-2 focus:ring-sage-200 outline-none text-sage-900 placeholder:text-sage-300 transition-all text-lg tracking-widest" />
              </div>
              {error && <p className="text-red-500 text-xs mt-2 ml-1">{error}</p>}
              <button type="submit"
                className="w-full mt-5 py-3.5 rounded-2xl bg-sage-600 hover:bg-sage-700 active:scale-[0.97] text-white font-semibold tracking-wide shadow-md shadow-sage-600/20 transition-all duration-200">
                Entrar
              </button>
              <p className="text-center text-xs text-sage-400 mt-4">Accede con tu número para ver tus clases y reservas</p>
            </form>
          </div>
        </div>
      );
    }

    /* =============================================================
       4. HORIZONTAL CALENDAR
       ============================================================= */
    function HorizontalCalendar({ selectedDate, onSelect }) {
      const scrollRef = useRef(null);
      const today = useMemo(() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }, []);

      const days = useMemo(() => {
        const arr = [];
        const start = new Date(today);
        start.setDate(today.getDate() - 7); // Una semana atrás para referencia

        const end = new Date(selectedDate > today ? selectedDate : today);
        end.setDate(end.getDate() + 14); // Dos semanas adelante desde la fecha seleccionada

        let curr = new Date(start);
        while (curr <= end) {
          arr.push(new Date(curr));
          curr.setDate(curr.getDate() + 1);
        }
        return arr;
      }, [today, selectedDate]);

      useEffect(() => {
        if (scrollRef.current) {
          const idx = days.findIndex(d => isSameDay(d, selectedDate));
          const child = scrollRef.current.children[idx];
          if (child) child.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
      }, [selectedDate, days]);

      const dayNames = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

      return (
        <div className="relative">
          <div ref={scrollRef} className="flex gap-2 overflow-x-auto hide-scrollbar py-2 px-1 snap-x snap-mandatory">
            {days.map(d => {
              const isSelected = isSameDay(d, selectedDate);
              const isToday = isSameDay(d, today);
              return (
                <button key={localDateStr(d)} onClick={() => onSelect(d)}
                  className={`snap-center shrink-0 flex flex-col items-center w-14 py-2.5 rounded-2xl transition-all duration-200
                    ${isSelected ? 'bg-sage-600 text-white shadow-md shadow-sage-600/30 scale-105'
                      : isToday ? 'bg-sage-100 text-sage-700'
                        : 'bg-white/60 text-sage-600 hover:bg-sage-50'}
                  `}>
                  <span className={`text-[10px] font-medium uppercase tracking-wider ${isSelected ? 'text-sage-200' : 'text-sage-400'}`}>
                    {dayNames[d.getDay()]}
                  </span>
                  <span className={`text-lg font-semibold mt-0.5 ${isSelected ? 'text-white' : ''}`}>{d.getDate()}</span>
                  {isToday && !isSelected && <div className="w-1.5 h-1.5 bg-sage-500 rounded-full mt-1" />}
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    /* =============================================================
       5. CLASS CARD
       ============================================================= */
    function ClassCard({ group, classType, currentUser, onRelease, onBook, onCancel, availableCredits }) {
      const availableSlots = group.slots.filter(s => s.status === 'released').length;
      const totalSlots = group.slots.length;
      const bookedSlots = group.slots.filter(s => s.status !== 'released').length;

      const userBonoSlot = group.slots.find(s => s.userId === currentUser.phone && s.status === 'bono');
      const userBookedSlot = group.slots.find(s => s.userId === currentUser.phone && s.status === 'booked');
      const userSlot = userBonoSlot || userBookedSlot;
      const fillPercent = Math.round((bookedSlots / totalSlots) * 100);

      // Can book only if has credits from cancellations
      const canBook = !userSlot && availableSlots > 0 && availableCredits > 0;

      return (
        <article className={`bg-white/70 backdrop-blur-xl rounded-3xl p-5 shadow-[0_4px_24px_rgba(74,103,65,0.06)] border transition-all duration-300 hover:shadow-[0_8px_32px_rgba(74,103,65,0.1)]
          ${userBonoSlot ? 'border-sage-300 ring-1 ring-sage-200' : 'border-sage-100/60'}`}>
          {/* Header */}
          <div className="flex items-start justify-between mb-3">
            <div className="flex items-center gap-3">
              <div className={`w-11 h-11 rounded-2xl flex items-center justify-center shadow-sm
                ${classType.color === 'terracotta' ? 'bg-orange-50 text-terracotta-500' : 'bg-sage-50 text-sage-600'}`}>
                <LucideIcon name={classType.icon} className="w-5 h-5" />
              </div>
              <div>
                <h3 className="font-semibold text-sage-900 text-[15px] leading-tight">{classType.name}</h3>
                {userBonoSlot && (
                  <span className="text-[10px] font-bold text-sage-600 bg-sage-100 px-2 py-0.5 rounded-full mt-0.5 inline-block">

                  </span>

              </div>
            </div>
            <div className="flex items-center gap-1.5 text-sage-500">
              <LucideIcon name="Clock" className="w-3.5 h-3.5" />
              <span className="text-sm font-medium">{group.time}</span>
            </div>
          </div>

          <p className="text-xs text-sage-400 mb-3 leading-relaxed">{classType.description}</p>

          {/* Capacity bar */}
          <div className="mb-3">
            <div className="flex justify-between items-center mb-1.5">
              <span className="text-xs font-medium text-sage-500">Ocupación</span>
              <span className={`text-xs font-bold px-2 py-0.5 rounded-full
                ${availableSlots === 0 ? 'bg-red-50 text-red-500' : availableSlots <= 2 ? 'bg-amber-50 text-amber-600' : 'bg-sage-50 text-sage-600'}
              `}>
                {availableSlots > 0 ? `¡${availableSlots} hueco${availableSlots !== 1 ? 's' : ''} libre${availableSlots !== 1 ? 's' : ''}!` : 'Completa'}
              </span>
            </div>
            <div className="w-full h-2 bg-sage-100 rounded-full overflow-hidden">
              <div className={`h-full rounded-full transition-all duration-500
                ${fillPercent >= 90 ? 'bg-red-400' : fillPercent >= 70 ? 'bg-amber-400' : 'bg-sage-400'}`}
                style={{ width: `${fillPercent}%` }} />
            </div>
            <p className="text-[10px] text-sage-400 mt-1">{bookedSlots}/{totalSlots} plazas ocupadas · {classType.duration} min</p>
          </div>

          {/* Actions */}
          <div className="flex gap-2">
            {userBonoSlot && (
              <button onClick={() => onCancel(group.id, userBonoSlot.slotIndex)}
                className="flex-1 py-2.5 px-4 rounded-2xl bg-amber-50 hover:bg-amber-100 active:scale-[0.97] text-amber-700 text-sm font-semibold transition-all border border-amber-200/60">
                No asistiré esta semana
              </button>
            )}
            {userBookedSlot && (
              <button onClick={() => onCancel(group.id, userBookedSlot.slotIndex)}
                className="flex-1 py-2.5 px-4 rounded-2xl bg-red-50 hover:bg-red-100 active:scale-[0.97] text-red-600 text-sm font-semibold transition-all border border-red-200/60">
                Cancelar reserva
              </button>
            )}
            {canBook && (
              <button onClick={() => onBook(group.id)}
                className="flex-1 py-2.5 px-4 rounded-2xl bg-sage-600 hover:bg-sage-700 active:scale-[0.97] text-white text-sm font-semibold transition-all shadow-sm shadow-sage-600/20">
                Reservar hueco
              </button>
            )}
            {!userSlot && availableSlots > 0 && availableCredits <= 0 && (
              <div className="flex-1 py-2.5 px-4 rounded-2xl bg-sage-50 text-sage-400 text-sm font-medium text-center">
                Sin créditos disponibles
              </div>
            )}
            {!userSlot && availableSlots === 0 && (
              <div className="flex-1 py-2.5 px-4 rounded-2xl bg-sage-50 text-sage-400 text-sm font-medium text-center">
                Sin huecos disponibles
              </div>
            )}
          </div>
        </article>
      );
    }

              <div className="bg-sage-600 rounded-2xl p-3 text-center text-white shadow-lg shadow-sage-200 active:scale-95 transition-all flex flex-col items-center justify-center">

                  <div className="p-2 bg-sage-100 rounded-xl text-sage-600 group-hover:bg-sage-600 group-hover:text-white transition-all shadow-sm">

          </main>

                                          : [...userBonos, { classId: sched.classId, dayOfWeek: sched.dayOfWeek, time: sched.time }];

                        </div>

                </div>
              </div>
            </Modal>

          {editingGroup && (

              <div className="space-y-6">

                    <input type="number" min="1" max="50"
                      value={editingGroup.slots.length}
                      onChange={(e) => {
                        const val = parseInt(e.target.value);

                      className="w-20 text-2xl font-bold text-sage-800 bg-transparent border-none text-center focus:ring-0 p-0" />

                    <button onClick={() => {
                      onUpdateCapacity(editingGroup.id, editingGroup.slots.length + 1);
                    }}
                      className="p-3 bg-white shadow-sm rounded-2xl hover:bg-sage-100 active:scale-90 active:bg-sage-100 transition-all text-sage-600">
                      <LucideIcon name="Plus" className="w-5 h-5" />
                    </button>
                  </div>
                  <p className="text-[10px] text-sage-400 text-center mt-2 font-medium tracking-wide uppercase">Clica en el número para editar directamente</p>
                </div>

                <div className="border-t border-sage-100 pt-5">
                  <label className="block text-xs font-bold text-sage-500 uppercase mb-4">Listado de Asistentes</label>
                  <div className="space-y-2 max-h-60 overflow-y-auto pr-1">

                      <div key={idx} className="flex items-center justify-between p-3 bg-sage-50/50 rounded-2xl border border-sage-100">
                        {sl.status === 'released' ? (
                          <>
                            <select className="flex-1 bg-transparent text-xs font-medium border-none focus:ring-0"
                              onChange={(e) => {
                                const user = studentOptions.find(u => u.phone === e.target.value);
                                if (user) onUpdateSlot(editingGroup.id, idx, user);
                              }}>
                              <option value="">+ Añadir Alumno...</option>
                              {studentOptions.map(u => <option key={u.phone} value={u.phone}>{u.name} ({u.phone})</option>)}
                            </select>
                          </>
                        ) : (
                          <>
                            <div className="flex flex-col">
                              <div className="flex items-center gap-1.5">
                                <span className="text-sm font-bold text-sage-800">{sl.userName}</span>
                                {sl.status === 'bono' && <span className="text-[8px] bg-sage-100 text-sage-600 px-1.5 py-0.5 rounded-full font-bold">BONO</span>}
                                {sl.status === 'booked' && <span className="text-[8px] bg-blue-50 text-blue-500 px-1.5 py-0.5 rounded-full font-bold">EXTRA</span>}
                              </div>
                              <span className="text-[10px] text-sage-400">{sl.userId}</span>
                            </div>
                            <button onClick={() => onUpdateSlot(editingGroup.id, idx, null)}
                              className="p-2 text-red-400 hover:bg-red-50 rounded-xl transition-colors">
                              <LucideIcon name="UserX" className="w-4 h-4" />
                            </button>
                          </>
                        )}
                      </div>
                    ))}
                  </div>
                </div>

                <div className="pt-6 border-t border-sage-100 mt-2">
                  <button onClick={() => {
                    if (confirm(`¿Estás seguro de que quieres eliminar este evento: ${getCT(editingGroup).name}?`)) {
                      onDeleteGroup(editingGroup.id);
                      setEditingGroupId(null);
                    }
                  }}
                    className="w-full py-3 bg-red-50 text-red-600 rounded-2xl text-xs font-bold hover:bg-red-100 transition-colors flex items-center justify-center gap-2">
                    <LucideIcon name="Shield" className="w-4 h-4 text-red-400" />
                    ELIMINAR ESTE EVENTO
                  </button>
                </div>

                <p className="text-[10px] text-sage-400 text-center italic mt-4">Los cambios se guardan automáticamente en la nube simulada.</p>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    /* =============================================================

    function StudentView({ currentUser, groups, onRelease, onBook, onCancel, onLogout }) {
      const [selectedDate, setSelectedDate] = useState(() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; });
      const [tab, setTab] = useState('clases');

      const getCT = (g) => CLASS_TYPES.find(c => c.id === g.classId) || { name: g.customName || 'Evento', icon: 'Sparkles', color: 'sage', description: 'Clase especial programada por la escuela.' };

      const dayGroups = Object.values(groups)
        .filter(g => g.date === localDateStr(selectedDate))
        .sort((a, b) => a.time.localeCompare(b.time));

      // All my active slots (bono + booked)
      const myBookings = Object.values(groups)
        .filter(g => g.slots.some(s => s.userId === currentUser.phone && (s.status === 'bono' || s.status === 'booked')))
        .sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));

      // --- CREDIT CALCULATION ---
      const currentMonth = localDateStr(selectedDate).slice(0, 7);
      const allGroups = Object.values(groups);

      // Count bono classes this month (active)
      const bonoClassesThisMonth = allGroups.filter(g =>
        g.date.startsWith(currentMonth) &&
        g.slots.some(s => s.userId === currentUser.phone && s.status === 'bono')
      ).length;

      // Count how many bonos the user has (permanent weekly assignments)
      const userBonos = currentUser.bonos || [];

      // Count how many bono classes were CANCELLED this month (bonos that should exist but student cancelled)
      // We know a bono was cancelled if: the group matches a bono pattern, but user is NOT in it
      let expectedBonoClasses = 0;
      userBonos.forEach(bono => {
        expectedBonoClasses += allGroups.filter(g => {
          const gDow = dowFromDateStr(g.date);
          return g.date.startsWith(currentMonth) && g.classId === bono.classId && gDow === bono.dayOfWeek && g.time === bono.time;
        }).length;
      });
      const cancelledBonos = expectedBonoClasses - bonoClassesThisMonth;

      // Count extra bookings (manually booked, not bono)
      const extraBookings = allGroups.filter(g =>
        g.date.startsWith(currentMonth) &&
        g.slots.some(s => s.userId === currentUser.phone && s.status === 'booked')
      ).length;

      const availableCredits = cancelledBonos - extraBookings;

      return (
        <div className="min-h-dvh bg-gradient-to-br from-cream-50 via-sage-50 to-cream-100">
          <header className="sticky top-0 z-30 bg-white/70 backdrop-blur-xl border-b border-sage-100/50 px-4 pt-3 pb-0">
            <div className="flex items-center justify-between max-w-lg mx-auto w-full mb-3">
              <div className="flex-1">
                <h1 className="font-serif text-lg font-semibold text-sage-800">Namaste, {currentUser.name?.split(' ')[0] || 'Yogui'}</h1>
                <p className="text-xs text-sage-400">Encuentra tu próxima clase</p>
              </div>
              <button onClick={onLogout} className="p-2 rounded-xl bg-sage-50 hover:bg-sage-100 text-sage-600 transition-all flex items-center gap-2 shrink-0">
                <span className="text-xs font-semibold">Salir</span>
                <LucideIcon name="LogOut" className="w-5 h-5" />
              </button>
            </div>

            {/* Credit info bar */}
            {userBonos.length > 0 && (
              <div className="max-w-lg mx-auto mb-2 px-3 py-2 bg-sage-50 rounded-xl flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <LucideIcon name="Ticket" className="w-4 h-4 text-sage-600" />
                  <span className="text-xs font-medium text-sage-600">Bono: {userBonos.length} clases/semana</span>
                </div>
                <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${availableCredits > 0 ? 'bg-blue-50 text-blue-600' : 'bg-sage-100 text-sage-400'}`}>
                  {availableCredits > 0 ? `${availableCredits} crédito${availableCredits !== 1 ? 's' : ''}` : 'Sin créditos extra'}
                </span>
              </div>
            )}

            <nav className="flex gap-1 max-w-lg mx-auto bg-sage-100/50 rounded-2xl p-1" aria-label="Navegación principal">
              <button onClick={() => setTab('clases')}
                className={`flex-1 py-2 rounded-xl text-sm font-medium transition-all duration-200
                  ${tab === 'clases' ? 'bg-white shadow-sm text-sage-800' : 'text-sage-500 hover:text-sage-700'}`}>
                Clases
              </button>
              <button onClick={() => setTab('misReservas')}
                className={`flex-1 py-2 rounded-xl text-sm font-medium transition-all duration-200
                  ${tab === 'misReservas' ? 'bg-white shadow-sm text-sage-800' : 'text-sage-500 hover:text-sage-700'}`}>
                Mis reservas
              </button>
            </nav>
          </header>

          <main className="max-w-lg mx-auto px-4 pb-8">
            {tab === 'clases' && (
              <>
                <div className="mt-4 mb-2">
                  <HorizontalCalendar selectedDate={selectedDate} onSelect={setSelectedDate} />
                </div>
                <p className="text-xs text-sage-400 font-medium uppercase tracking-wider mb-3 ml-1">
                  {getDayName(selectedDate)} · {formatDate(selectedDate)}
                </p>
                <div className="space-y-3">
                  {dayGroups.length === 0 && (
                    <div className="text-center py-16">
                      <LucideIcon name="Moon" className="w-12 h-12 text-sage-200 mx-auto mb-3" />
                      <p className="text-sage-400 text-sm">No hay clases programadas</p>
                      <p className="text-sage-300 text-xs mt-1">Prueba otro día del calendario</p>
                    </div>
                  )}
                  {dayGroups.map(g => {
                    const ct = getCT(g);
                    return (
                      <ClassCard key={g.id} group={g} classType={ct} currentUser={currentUser}
                        onRelease={onRelease} onBook={onBook} onCancel={onCancel}
                        availableCredits={availableCredits} />
                    );
                  })}
                </div>
              </>
            )}

            {tab === 'misReservas' && (
              <div className="mt-4">
                {myBookings.length === 0 && (
                  <div className="text-center py-16">
                    <LucideIcon name="CalendarDays" className="w-12 h-12 text-sage-200 mx-auto mb-3" />
                    <p className="text-sage-400 text-sm">Aún no tienes reservas</p>
                    <p className="text-sage-300 text-xs mt-1">Explora las clases disponibles</p>
                  </div>
                )}
                <div className="space-y-3">
                  {myBookings.map(g => {
                    const ct = getCT(g);
                    const slot = g.slots.find(s => s.userId === currentUser.phone && (s.status === 'bono' || s.status === 'booked'));
                    const isBono = slot?.status === 'bono';
                    return (
                      <div key={g.id} className={`bg-white/70 backdrop-blur-xl rounded-3xl p-4 border shadow-sm
                        ${isBono ? 'border-sage-200' : 'border-blue-200'}`}>
                        <div className="flex items-center justify-between">
                          <div className="flex items-center gap-3">
                            <div className={`w-10 h-10 rounded-2xl flex items-center justify-center
                              ${ct.color === 'terracotta' ? 'bg-orange-50 text-terracotta-500' : 'bg-sage-50 text-sage-600'}`}>
                              <LucideIcon name={ct.icon} className="w-5 h-5" />
                            </div>
                            <div>
                              <h3 className="text-base font-semibold text-sage-800">{ct.name}</h3>
                              <p className="text-sm text-sage-400">
                                {new Date(g.date + 'T00:00').toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' })} · {g.time}
                              </p>
                            </div>
                          </div>
                          <span className={`text-[10px] font-bold px-2 py-1 rounded-full uppercase tracking-wider
                            ${isBono ? 'bg-sage-50 text-sage-600' : 'bg-blue-50 text-blue-600'}`}>
                            {isBono ? '⭐ Fija' : 'Reservada'}
                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    /* =============================================================
       8. MAIN APP — State Management & Concurrency
       ============================================================= */
    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        try { const s = localStorage.getItem('akasha_user'); return s ? JSON.parse(s) : null; } catch { return null; }
      });
      const [data, setData] = useState({ users: {}, groups: {} });
      const [isCloudLoaded, setIsCloudLoaded] = useState(false);
      const [toasts, setToasts] = useState([]);
      const toastIdRef = useRef(0);
      const lockRef = useRef(new Set());
      const skipNextSnapshotRef = useRef(false);

      const [cloudStatus, setCloudStatus] = useState('Conectando...');

      const addToast = useCallback((message, type = 'info') => {
        const id = ++toastIdRef.current;
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
      }, []);

      // MODO HÍBRIDO: NUBE + LOCAL DE SEGURIDAD
      useEffect(() => {
        let isActive = true;
        let unsubscribe = null;

        const cloudTimeout = setTimeout(() => {
          if (isActive && !isCloudLoaded) {
            console.log("Cargando modo local (Nube lenta)");
            const localData = localStorage.getItem('akasha_data');
            setData(prev => {
              if (Object.keys(prev.groups || {}).length === 0) {
                const raw = localData ? JSON.parse(localData) : generateSeedData();
                return ensureFutureGroups(raw);
              }
              return prev;
            });
            setIsCloudLoaded(true);
            setCloudStatus('Local 🏠');
          }
        }, 8000); // 8 segundos de margen

        const startSync = async () => {
          try {
            setCloudStatus('Autenticando...');
            auth.signInAnonymously().then(() => {
              if (!isActive) return;
              setCloudStatus('Conectado ☁️');
              addToast('¡Sincronización activa! ☁️', 'success');

              const docRef = db.collection('yoga').doc('main');
              unsubscribe = docRef.onSnapshot((docSnap) => {
                // Ignore local echo (our own recently written data)
                if (docSnap.metadata.hasPendingWrites) return;

                // Explicit skip flag (manual backup)
                if (skipNextSnapshotRef.current) {
                  skipNextSnapshotRef.current = false;
                  setIsCloudLoaded(true);
                  clearTimeout(cloudTimeout);
                  return;
                }

                if (docSnap.exists) {
                  const cloudData = docSnap.data();
                  // Check if this incoming data is actually newer/different
                  const expanded = ensureFutureGroups(cloudData);
                  setData(expanded);

                  // Auto-generate if cloud is missing classes
                  if (Object.keys(expanded.groups).length > (Object.keys(cloudData.groups || {}).length)) {
                    skipNextSnapshotRef.current = true;
                    docRef.set(expanded).catch(() => { });
                  }
                } else {
                  const seed = generateSeedData();
                  skipNextSnapshotRef.current = true;
                  docRef.set(seed).catch(() => { });
                  setData(seed);
                }
                setIsCloudLoaded(true);
                clearTimeout(cloudTimeout);
              }, (error) => {
                setCloudStatus('Offline 🏠');
              });
            }).catch(err => {
              const msg = err.code === 'auth/operation-not-allowed' ? 'Activa Anónimo' : 'Error Auth';
              setCloudStatus(`${msg} ❌`);
              addToast(`Error: ${err.message}`, 'error');
            });
          } catch (err) {
            setCloudStatus('Error conexión ❌');
          }
        };

        startSync();
        return () => {
          isActive = false;
          clearTimeout(cloudTimeout);
          if (unsubscribe) unsubscribe();
        };
      }, [addToast]);

      // LOCAL STORAGE SAVE ONLY (Removed Cloud Sync to prevent race conditions)
      useEffect(() => {
        if (!isCloudLoaded) return;
        localStorage.setItem('akasha_data', JSON.stringify(data));
      }, [data, isCloudLoaded]);

      useEffect(() => {
        if (currentUser) localStorage.setItem('akasha_user', JSON.stringify(currentUser));
        else localStorage.removeItem('akasha_user');
      }, [currentUser]);

      const forceRefresh = useCallback(() => window.location.reload(), []);

      const dismissToast = useCallback(id => setToasts(prev => prev.filter(t => t.id !== id)), []);

      const handleLogin = useCallback((phone) => {
        const clean = sanitizePhone(phone);
        if (!isValidPhone(clean)) return;
        let user = data.users[clean];
        if (!user) {
          addToast('Número no registrado — Contacta con administración.', 'error');
          return;
        }
        if (user.isBlocked) {
          addToast('Acceso restringido. Contacta con administración.', 'error');
          return;
        }
        setCurrentUser(user);
        addToast(`¡Bienvenid@, ${user.name.split(' ')[0]}!`, 'success');
      }, [data.users, addToast]);

      const handleLogout = useCallback(() => {
        setCurrentUser(null);
        addToast('Sesión cerrada', 'info');
      }, [addToast]);

      const APP_VERSION = "2.1 (Nuevas Clases)";

      const handleAddStudent = useCallback((name, phone) => {
        const clean = sanitizePhone(phone);
        if (!isValidPhone(clean)) { addToast('Introduce un teléfono válido (9-15 cifras)', 'error'); return; }

        setData(prev => {
          if (prev.users[clean]) {
            setTimeout(() => addToast('Este teléfono ya está registrado', 'info'), 10);
            return prev;
          }
          const newUser = { phone: clean, name, role: 'student', registeredAt: Date.now(), bonos: [], isBlocked: false };
          setTimeout(() => addToast(`Alumno ${name} registrado correctamente`, 'success'), 10);
          return {
            ...prev,
            users: {
              ...prev.users,
              [clean]: newUser
            }
          };
        });
      }, [addToast]);

      const handleUpdateUser = useCallback((phone, updates) => {
        setData(prev => ({
          ...prev,
          users: {
            ...prev.users,
            [phone]: { ...prev.users[phone], ...updates }
          }
        }));
      }, []);

      /* --- Handle Bono Updates --- */
      const handleUpdateBonos = useCallback((phone, newBonos) => {
        setData(prev => {
          const updatedUsers = { ...prev.users, [phone]: { ...prev.users[phone], bonos: newBonos } };
          const strippedGroups = {};
          Object.keys(prev.groups).forEach(gId => {
            const g = prev.groups[gId];
            const cleanedSlots = g.slots.map(s =>
              s.userId === phone && s.status === 'bono'
                ? { ...s, userId: null, userName: null, status: 'released', originalUserId: null }
                : s
            );
            strippedGroups[gId] = { ...g, slots: cleanedSlots };
          });
          const finalGroups = applyBonosToGroups(updatedUsers, strippedGroups);
          const newData = { users: updatedUsers, groups: finalGroups };
          try {
            if (auth.currentUser) {
              skipNextSnapshotRef.current = true;
              db.collection('yoga').doc('main').set(newData);
            }
          } catch (e) { }
          return newData;
        });
        addToast(`Bonos actualizados (${newBonos.length} clases/semana)`, 'success');
      }, [addToast]);

      /* --- Admin Advanced Actions --- */
      const handleAddGroup = useCallback((classId, date, time, capacity, customName) => {
        setData(prev => {
          const suffix = customName ? `_${customName.replace(/\s+/g, '')}` : '';
          const groupId = `${classId}${suffix}_${date}_${time.replace(':', '')}`;
          if (prev.groups[groupId]) {
            setTimeout(() => addToast('Ya existe una clase a esa hora', 'info'), 10);
            return prev;
          }
          const slots = Array.from({ length: capacity }, (_, i) => ({
            slotIndex: i, userId: null, userName: null, status: 'released', originalUserId: null
          }));
          const newGroups = { ...prev.groups, [groupId]: { id: groupId, classId, date, time, slots, customName } };
          return { ...prev, groups: newGroups };
        });
        addToast('Clase creada correctamente', 'success');
      }, [addToast]);

      const handleAdminUpdateSlot = useCallback((groupId, slotIndex, user) => {
        setData(prev => {
          const group = prev.groups[groupId];
          let updatedSlots = [...group.slots];

          if (user) {
            // Añadir: buscamos el primer hueco libre
            const idx = updatedSlots.findIndex(s => s.status === 'released');
            if (idx !== -1) {
              updatedSlots[idx] = { ...updatedSlots[idx], userId: user.phone, userName: user.name, status: 'confirmed', originalUserId: user.phone };
            }
          } else {
            // Quitar: vaciamos la posición actual
            updatedSlots[slotIndex] = { ...updatedSlots[slotIndex], userId: null, userName: null, status: 'released' };
          }

          // LÓGICA DE COMPACTACIÓN
          const occupied = updatedSlots.filter(s => s.status !== 'released');
          const capacity = group.slots.length;
          const compacted = Array.from({ length: capacity }, (_, i) => {
            if (i < occupied.length) {
              return { ...occupied[i], slotIndex: i };
            }
            return { slotIndex: i, userId: null, userName: null, status: 'released', originalUserId: null };
          });

          return { ...prev, groups: { ...prev.groups, [groupId]: { ...group, slots: compacted } } };
        });
        addToast(user ? 'Alumno asignado manual' : 'Plaza liberada por Administrador', 'info');
      }, [addToast]);

      const handleUpdateCapacity = useCallback((groupId, newCapacity) => {
        setData(prev => {
          const group = prev.groups[groupId];
          let newSlots = [...group.slots];
          if (newCapacity > group.slots.length) {
            for (let i = group.slots.length; i < newCapacity; i++) {
              newSlots.push({ slotIndex: i, userId: null, userName: null, status: 'released', originalUserId: null });
            }
          } else {
            newSlots = newSlots.slice(0, newCapacity);
          }
          return { ...prev, groups: { ...prev.groups, [groupId]: { ...group, slots: newSlots.map((s, i) => ({ ...s, slotIndex: i })) } } };
        });
      }, []);

      const handleDeleteGroup = useCallback((groupId) => {
        setData(prev => {
          const newGroups = { ...prev.groups };
          delete newGroups[groupId];
          return { ...prev, groups: newGroups };
        });
        addToast('Evento eliminado correctamente', 'info');
      }, [addToast]);

      const handleRelease = useCallback((groupId, slotIndex) => {
        setData(prev => {
          const group = prev.groups[groupId];
          if (!group) return prev;

          const slot = group.slots[slotIndex];
          const isBonoSlot = slot.status === 'bono';
          const releasedUserId = slot.userId;

          const updatedSlots = group.slots.map((s, i) =>
            i === slotIndex ? { ...s, status: 'released', userId: null, userName: null, originalUserId: null } : s
          );

          const occupied = updatedSlots.filter(s => s.status !== 'released');
          const capacity = group.slots.length;
          const compacted = Array.from({ length: capacity }, (_, i) => {
            if (i < occupied.length) return { ...occupied[i], slotIndex: i };
            return { slotIndex: i, userId: null, userName: null, status: 'released', originalUserId: null };
          });

          const releasedBonos = [...(group.releasedBonos || [])];
          if (isBonoSlot && releasedUserId && !releasedBonos.includes(releasedUserId)) {
            releasedBonos.push(releasedUserId);
          }

          const newData = { ...prev, groups: { ...prev.groups, [groupId]: { ...group, slots: compacted, releasedBonos } } };
          if (auth.currentUser) {
            skipNextSnapshotRef.current = true;
            db.collection('yoga').doc('main').set(newData).catch(() => { });
          }
          return newData;
        });
        addToast('Plaza liberada — otro yogui podrá disfrutarla 🙏', 'success');
      }, [addToast]);

      const handleBook = useCallback((groupId) => {
        const lockKey = `${groupId}_${currentUser?.phone}`;
        if (lockKey.includes('undefined')) return;
        if (lockRef.current.has(lockKey)) { addToast('Ya estás procesando esta reserva…', 'info'); return; }
        lockRef.current.add(lockKey);

        setData(prev => {
          const group = prev.groups[groupId];
          if (!group) { lockRef.current.delete(lockKey); return prev; }

          // CREDIT-BASED VERIFICATION
          const userObj = prev.users[currentUser.phone];
          const userBonos = userObj?.bonos || [];
          const currentMonth = group.date.slice(0, 7);
          const allGroups = Object.values(prev.groups);

          // Count active bono classes this month
          const bonoClassesThisMonth = allGroups.filter(g =>
            g.date.startsWith(currentMonth) &&
            g.slots.some(s => s.userId === currentUser.phone && s.status === 'bono')
          ).length;

          // Count expected bono classes this month
          let expectedBonoClasses = 0;
          userBonos.forEach(bono => {
            expectedBonoClasses += allGroups.filter(g => {
              const gDow = dowFromDateStr(g.date);
              return g.date.startsWith(currentMonth) && g.classId === bono.classId && gDow === bono.dayOfWeek && g.time === bono.time;
            }).length;
          });
          const cancelledBonos = expectedBonoClasses - bonoClassesThisMonth;

          // Count extra bookings already made
          const extraBookings = allGroups.filter(g =>
            g.date.startsWith(currentMonth) &&
            g.slots.some(s => s.userId === currentUser.phone && s.status === 'booked')
          ).length;

          const availableCredits = cancelledBonos - extraBookings;

          if (availableCredits <= 0) {
            setTimeout(() => addToast('No tienes créditos disponibles. Cancela una clase fija para poder reservar otra.', 'error'), 10);
            lockRef.current.delete(lockKey); return prev;
          }

          const slotIdx = group.slots.findIndex(s => s.status === 'released');
          if (slotIdx === -1) {
            setTimeout(() => addToast('¡Vaya! Ese hueco acaba de ser reservado por otro yogui', 'error'), 10);
            lockRef.current.delete(lockKey); return prev;
          }

          if (group.slots.some(s => s.userId === currentUser?.phone)) {
            setTimeout(() => addToast('Ya tienes una plaza en esta clase', 'info'), 10);
            lockRef.current.delete(lockKey); return prev;
          }

          const newSlots = group.slots.map((s, i) =>
            i === slotIdx ? { ...s, status: 'booked', userId: currentUser.phone, userName: currentUser.name } : s
          );

          const occupied = newSlots.filter(s => s.status !== 'released');
          const capacity = group.slots.length;
          const compacted = Array.from({ length: capacity }, (_, i) => {
            if (i < occupied.length) return { ...occupied[i], slotIndex: i };
            return { slotIndex: i, userId: null, userName: null, status: 'released', originalUserId: null };
          });

          lockRef.current.delete(lockKey);
          const newData = { ...prev, groups: { ...prev.groups, [groupId]: { ...group, slots: compacted } } };
          if (auth.currentUser) {
            skipNextSnapshotRef.current = true;
            db.collection('yoga').doc('main').set(newData).catch(() => { });
          }
          return newData;
        });
        addToast('¡Reserva confirmada! Nos vemos en la esterilla 🧘', 'success');
      }, [currentUser, addToast]);

      const handleCancel = useCallback((groupId, slotIndex) => {
        setData(prev => {
          const group = prev.groups[groupId];
          if (!group) return prev;

          const slot = group.slots[slotIndex];
          const isBonoSlot = slot.status === 'bono';
          const releasedUserId = slot.userId;

          const updatedSlots = group.slots.map((s, i) =>
            i === slotIndex ? { ...s, status: 'released', userId: null, userName: null, originalUserId: null } : s
          );

          const occupied = updatedSlots.filter(s => s.status !== 'released');
          const capacity = group.slots.length;
          const compacted = Array.from({ length: capacity }, (_, i) => {
            if (i < occupied.length) return { ...occupied[i], slotIndex: i };
            return { slotIndex: i, userId: null, userName: null, status: 'released', originalUserId: null };
          });

          // Guardamos memoria de la liberación del bono
          const releasedBonos = [...(group.releasedBonos || [])];
          if (isBonoSlot && releasedUserId && !releasedBonos.includes(releasedUserId)) {
            releasedBonos.push(releasedUserId);
          }

          const newData = { ...prev, groups: { ...prev.groups, [groupId]: { ...group, slots: compacted, releasedBonos } } };
          if (auth.currentUser) {
            skipNextSnapshotRef.current = true;
            db.collection('yoga').doc('main').set(newData).catch(() => { });
          }
          return newData;
        });
        addToast('Reserva cancelada — el hueco vuelve a estar libre', 'info');
      }, [addToast]);

      const handleResetData = useCallback(() => {
        const seed = generateSeedData(data.users);
        setData(seed);
        addToast('Base de datos reiniciada con bonos aplicados', 'info');
      }, [addToast, data.users]);

      const isAdmin = currentUser?.role === 'admin';

      return (
        <>
          <div className="fixed bottom-4 right-4 z-50 flex items-center gap-2 px-3 py-1.5 bg-white/10 backdrop-blur-md rounded-full border border-white/20 text-[10px] text-sage-400 font-medium">
            <div className={`w-1.5 h-1.5 rounded-full ${cloudStatus.includes('☁️') ? 'bg-indigo-400 animate-pulse' : 'bg-sage-300'}`}></div>
            {cloudStatus}
            <button onClick={forceRefresh} className="ml-2 hover:text-indigo-400 underline underline-offset-2">Actualizar</button>
          </div>

          <Toast toasts={toasts} onDismiss={dismissToast} />
          {!currentUser && <LoginScreen onLogin={handleLogin} />}
          {currentUser && isAdmin && (
            <AdminView
              users={data.users}
              groups={data.groups}
              onLogout={handleLogout}
              addToast={addToast}
              onAddGroup={handleAddGroup}
              onDeleteGroup={handleDeleteGroup}
              onUpdateSlot={handleAdminUpdateSlot}
              onUpdateCapacity={handleUpdateCapacity}
              onAddStudent={handleAddStudent}
              onUpdateUser={handleUpdateUser}
              onUpdateBonos={handleUpdateBonos}
              onResetData={handleResetData}
            />
          )}
          {currentUser && !isAdmin && (
            <StudentView currentUser={data.users[currentUser.phone] || currentUser} groups={data.groups}
              onRelease={handleRelease} onBook={handleBook} onCancel={handleCancel} onLogout={handleLogout} />
          )}
        </>
      );
    }

    /* Mount */
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>

</html>
